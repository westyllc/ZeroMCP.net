name: Build and Publish to NuGet

on:
  push:
    branches: [ main, master, 'westy/**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, 'westy/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Tests multi-target net10/net9/net8; each needs its runtime to execute.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Run tests
        run: dotnet test -c Release --no-build --verbosity normal

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ZeroMCP/ZeroMCP.csproj

      - name: Build
        run: dotnet build ZeroMCP/ZeroMCP.csproj -c Release --no-restore

      - name: Pack
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          dotnet pack ZeroMCP/ZeroMCP.csproj -c Release -o ./nupkgs --no-build -p:Version=$VERSION

      - name: Pack
        run: dotnet pack ZeroMCP/ZeroMcp.csproj -c Release -p:Version=${VERSION} -o ./artifacts

      - name: Push to NuGet.org
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Push to GitHub Packages
        run: dotnet nuget push ./artifacts/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
