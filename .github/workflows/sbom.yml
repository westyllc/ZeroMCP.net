name: Generate and Archive SBOM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ "published" ]

jobs:
  build-sbom:
    runs-on: ubuntu-latest
    
    # Required permissions for the action to log details properly
    permissions:
      contents: write
      actions: read

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Generate and automatically upload the SBOM file
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: 'spdx-json'         # Options: 'spdx-json' or 'cyclonedx-json'
          output-file: 'sbom.spdx.json'
          upload-artifact: true        # Automatically uploads the artifact to the run
